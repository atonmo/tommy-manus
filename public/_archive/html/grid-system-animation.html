<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>栅格系统建立 — Editable</title>
    <!--
      可编辑说明
      1. 改视觉：编辑下方 :root CSS 变量
      2. 改栅格规则 / 文案：编辑底部 <script> 里的 CONFIG
      3. 预览：浏览器打开本页；拖动滑块可手动改窗宽，点 Play 循环播放
      4. 导出：截图 / 打印 PDF；源文件可继续改
    -->
    <style>
      :root {
        --bg: #eef0f3;
        --card: #ffffff;
        --text: #111111;
        --muted: #8a8f98;
        --column: rgba(245, 189, 150, 0.78);
        --chrome: #ffffff;
        --chrome-border: rgba(0, 0, 0, 0.06);
        --url-bg: #f2f3f5;
        --dot-red: #ff5f57;
        --dot-yellow: #febc2e;
        --dot-green: #28c840;
        --page-max: 1080px;
        --card-radius: 18px;
        --browser-radius: 14px;
        --font:
          "SF Pro Text", "PingFang SC", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        font-family: var(--font);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: var(--page-max);
        margin: 0 auto;
        padding: 36px 24px 48px;
      }

      .specs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 18px;
      }

      .spec {
        background: var(--card);
        border-radius: var(--card-radius);
        padding: 22px 20px 20px;
        min-height: 118px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
      }

      .spec-value {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      .spec-label {
        margin: 10px 0 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
      }

      .spec-desc {
        margin: 4px 0 0;
        font-size: 13px;
        line-height: 1.35;
        color: var(--muted);
      }

      .stage {
        display: flex;
        justify-content: center;
        align-items: stretch;
        min-height: 520px;
        padding: 8px 0 4px;
      }

      .browser {
        width: var(--browser-width, 100%);
        max-width: 100%;
        background: var(--chrome);
        border-radius: var(--browser-radius);
        border: 1px solid var(--chrome-border);
        box-shadow:
          0 10px 28px rgba(15, 20, 30, 0.08),
          0 1px 0 rgba(255, 255, 255, 0.7) inset;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: width 0.05s linear;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr minmax(180px, 42%) 1fr;
        align-items: center;
        gap: 12px;
        height: 46px;
        padding: 0 14px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }

      .traffic {
        display: flex;
        gap: 7px;
        align-items: center;
      }

      .traffic i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: block;
      }

      .traffic .r {
        background: var(--dot-red);
      }
      .traffic .y {
        background: var(--dot-yellow);
      }
      .traffic .g {
        background: var(--dot-green);
      }

      .nav-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .icon-btn {
        width: 16px;
        height: 16px;
        opacity: 0.35;
        color: #222;
      }

      .url {
        height: 28px;
        border-radius: 999px;
        background: var(--url-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12.5px;
        color: #3a3a3a;
        padding: 0 14px;
      }

      .url svg {
        width: 11px;
        height: 11px;
        opacity: 0.55;
      }

      .nav-right {
        display: flex;
        justify-content: flex-end;
        gap: 14px;
        align-items: center;
      }

      .content {
        position: relative;
        flex: 1;
        min-height: 560px;
        background: #fff;
        padding: 0 var(--margin-px, 80px);
      }

      .columns {
        height: 100%;
        min-height: 560px;
        display: grid;
        grid-template-columns: repeat(var(--cols, 24), minmax(0, 1fr));
        gap: var(--gutter-px, 16px);
      }

      .columns span {
        display: block;
        height: 100%;
        background: var(--column);
        border-radius: 1px;
      }

      .hud {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }

      .hud-left {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(0, 0, 0, 0.06);
        font-size: 12.5px;
        color: #444;
      }

      .pill strong {
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: min(420px, 100%);
        flex: 1;
        justify-content: flex-end;
      }

      button {
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: #fff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button.primary {
        background: #111;
        color: #fff;
        border-color: #111;
      }

      input[type="range"] {
        flex: 1;
        min-width: 140px;
        accent-color: #111;
      }

      .hint {
        margin: 14px 0 0;
        font-size: 12px;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .specs {
          grid-template-columns: repeat(2, 1fr);
        }
        .toolbar {
          grid-template-columns: auto 1fr auto;
        }
        .spec-value {
          font-size: 28px;
        }
      }

      @media (max-width: 560px) {
        .specs {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="specs" id="specs"></div>

      <div class="stage">
        <div class="browser" id="browser">
          <div class="toolbar">
            <div class="nav-left">
              <div class="traffic">
                <i class="r"></i><i class="y"></i><i class="g"></i>
              </div>
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <path
                  d="M6 3H4.5A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13H6M10 3h1.5A1.5 1.5 0 0 1 13 4.5v7a1.5 1.5 0 0 1-1.5 1.5H10M6 8h4"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <path
                  d="M9.5 3.5 5 8l4.5 4.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <path
                  d="M6.5 3.5 11 8 6.5 12.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="url">
              <svg viewBox="0 0 16 16" fill="none">
                <circle
                  cx="8"
                  cy="8"
                  r="5.25"
                  stroke="currentColor"
                  stroke-width="1.3"
                />
                <path
                  d="M3 8h10M8 2.75c1.4 1.5 2.1 3.25 2.1 5.25S9.4 11.75 8 13.25M8 2.75C6.6 4.25 5.9 6 5.9 8s.7 3.75 2.1 5.25"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
              </svg>
              <span id="urlText">taobao.com</span>
            </div>
            <div class="nav-right">
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <path
                  d="M8 3v7M5.5 7.5 8 10l2.5-2.5M3.5 13h9"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <path
                  d="M8 3.5v9M3.5 8h9"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <rect
                  x="3.2"
                  y="3.2"
                  width="9.6"
                  height="9.6"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.3"
                />
              </svg>
            </div>
          </div>
          <div class="content" id="content">
            <div class="columns" id="columns"></div>
          </div>
        </div>
      </div>

      <div class="hud">
        <div class="hud-left">
          <span class="pill">窗宽 <strong id="wVal">—</strong></span>
          <span class="pill">边距 <strong id="mVal">—</strong></span>
          <span class="pill">列宽 <strong id="cVal">—</strong></span>
          <span class="pill">列数 <strong id="nVal">—</strong></span>
        </div>
        <div class="controls">
          <button type="button" id="playBtn" class="primary">Pause</button>
          <input
            id="widthSlider"
            type="range"
            min="42"
            max="100"
            step="0.1"
            value="100"
            aria-label="Browser width"
          />
        </div>
      </div>
      <p class="hint">
        模仿 javaon「栅格系统建立」动效：固定 gutter / 最小列宽，边距随断点变化，列数按
        4 递减。改 CONFIG 即可换成自己的规则。
      </p>
    </div>

    <script>
      /* ========== 在这里改数据 / 动效 ========== */
      const CONFIG = {
        url: "taobao.com",
        gutter: 16,
        maxMargin: 80,
        minColumn: 36,
        maxColumns: 24,
        columnStep: 4,
        minColumns: 12,
        /* 演示窗宽相对舞台的百分比范围（下限保证 12 列仍 ≥ minColumn） */
        widthMinPct: 58,
        widthMaxPct: 100,
        /* 一轮往返时长（秒） */
        duration: 2.5,
        autoplay: true,
        specs: [
          {
            id: "gutter",
            value: "16px",
            label: "Gutter Width",
            desc: "Fixed and unchanging",
          },
          {
            id: "margin",
            value: "80px",
            label: "Max Margin",
            desc: "Changes based on resolution breakpoints",
          },
          {
            id: "minCol",
            value: "36px",
            label: "Minimum Column Width",
            desc: "Fixed and unchanging",
          },
          {
            id: "cols",
            value: "24col",
            label: "Number of Columns",
            desc: "Reduces by 4 Columns as the Window Size Decreases",
            live: true,
          },
        ],
      };

      const specsEl = document.getElementById("specs");
      const browser = document.getElementById("browser");
      const columnsEl = document.getElementById("columns");
      const slider = document.getElementById("widthSlider");
      const playBtn = document.getElementById("playBtn");
      const urlText = document.getElementById("urlText");

      urlText.textContent = CONFIG.url;
      slider.min = String(CONFIG.widthMinPct);
      slider.max = String(CONFIG.widthMaxPct);

      function renderSpecs() {
        specsEl.innerHTML = CONFIG.specs
          .map(
            (s) => `
          <article class="spec" data-id="${s.id}">
            <p class="spec-value" data-role="value">${s.value}</p>
            <p class="spec-label">${s.label}</p>
            <p class="spec-desc">${s.desc}</p>
          </article>`
          )
          .join("");
      }

      function fitColumns(innerWidth) {
        let cols = CONFIG.maxColumns;
        while (cols > CONFIG.minColumns) {
          const gutters = (cols - 1) * CONFIG.gutter;
          const colW = (innerWidth - gutters) / cols;
          if (colW >= CONFIG.minColumn - 0.01) break;
          cols -= CONFIG.columnStep;
        }
        const gutters = (cols - 1) * CONFIG.gutter;
        const colW = Math.max(0, (innerWidth - gutters) / cols);
        return { cols, colW };
      }

      /** 当前列数下，保证列宽 ≥ minColumn 所需的最小内容区宽度 */
      function minInnerFor(cols) {
        return cols * CONFIG.minColumn + (cols - 1) * CONFIG.gutter;
      }

      function marginFor(browserW, preferredCols) {
        /* 宽时吃满 maxMargin；变窄时边距逐步收，但保证列宽底线 */
        const t =
          (browserW / stageWidth() - CONFIG.widthMinPct / 100) /
          (CONFIG.widthMaxPct / 100 - CONFIG.widthMinPct / 100);
        const ease = Math.max(0, Math.min(1, t));
        let margin = Math.round(
          Math.max(16, CONFIG.maxMargin * (0.28 + 0.72 * ease))
        );
        const need = minInnerFor(preferredCols);
        const maxMarginAllowed = Math.max(16, Math.floor((browserW - need) / 2));
        return Math.min(margin, maxMarginAllowed);
      }

      function stageWidth() {
        return browser.parentElement.getBoundingClientRect().width;
      }

      function paint(widthPct) {
        const bw = (stageWidth() * widthPct) / 100;
        browser.style.setProperty("--browser-width", `${bw}px`);

        /* 先按 maxMargin 估内宽 → 定列数，再反算边距保证 minColumn */
        let margin = Math.min(
          CONFIG.maxMargin,
          Math.max(16, Math.round(CONFIG.maxMargin * 0.35))
        );
        let inner = Math.max(0, bw - margin * 2);
        let { cols } = fitColumns(inner);
        margin = marginFor(bw, cols);
        inner = Math.max(0, bw - margin * 2);
        ({ cols } = fitColumns(inner));
        margin = marginFor(bw, cols);
        inner = Math.max(0, bw - margin * 2);
        const fitted = fitColumns(inner);
        cols = fitted.cols;
        const colW = fitted.colW;

        browser.style.setProperty("--margin-px", `${margin}px`);
        browser.style.setProperty("--gutter-px", `${CONFIG.gutter}px`);
        browser.style.setProperty("--cols", String(cols));

        if (columnsEl.children.length !== cols) {
          columnsEl.innerHTML = Array.from(
            { length: cols },
            () => "<span></span>"
          ).join("");
        }

        const live = specsEl.querySelector('[data-id="cols"] [data-role="value"]');
        if (live) live.textContent = `${cols}col`;

        document.getElementById("wVal").textContent =
          `${Math.round(bw)}px`;
        document.getElementById("mVal").textContent = `${margin}px`;
        document.getElementById("cVal").textContent =
          `${colW.toFixed(1)}px`;
        document.getElementById("nVal").textContent = String(cols);
      }

      let playing = CONFIG.autoplay;
      let start = performance.now();
      let manualPct = CONFIG.widthMaxPct;

      function loop(now) {
        if (playing) {
          const cycle = CONFIG.duration * 1000;
          const p = ((now - start) % cycle) / cycle;
          /* 0→1→0 三角波，模拟原片收放 */
          const tri = p < 0.5 ? p * 2 : (1 - p) * 2;
          const eased =
            tri < 0.5 ? 2 * tri * tri : 1 - Math.pow(-2 * tri + 2, 2) / 2;
          manualPct =
            CONFIG.widthMaxPct -
            (CONFIG.widthMaxPct - CONFIG.widthMinPct) * eased;
          slider.value = String(manualPct);
        }
        paint(manualPct);
        requestAnimationFrame(loop);
      }

      slider.addEventListener("input", () => {
        playing = false;
        playBtn.textContent = "Play";
        playBtn.classList.remove("primary");
        manualPct = Number(slider.value);
        paint(manualPct);
      });

      playBtn.addEventListener("click", () => {
        playing = !playing;
        playBtn.textContent = playing ? "Pause" : "Play";
        playBtn.classList.toggle("primary", playing);
        if (playing) start = performance.now();
      });

      window.addEventListener("resize", () => paint(manualPct));

      renderSpecs();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
