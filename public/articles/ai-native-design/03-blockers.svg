<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <rect width="1200" height="460" fill="#070708"/>
  <text x="48" y="52" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="0.22em" fill="#5B9FFF">BLOCKERS</text>
  <text x="48" y="86" font-family="PingFang SC, Inter, system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.55)">能生成 ≠ 能进业务</text>
  <g font-family="PingFang SC, Inter, system-ui, sans-serif">
    <rect x="48" y="130" width="340" height="260" rx="16" fill="#131318" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="100" cy="190" r="20" fill="rgba(91,159,255,0.14)" stroke="#5B9FFF"/>
    <text x="88" y="195" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#5B9FFF">01</text>
    <text x="80" y="250" font-size="20" font-weight="500" fill="#FFFFFF">不符合规范</text>
    <text x="80" y="286" font-size="14" fill="rgba(255,255,255,0.45)">生成结果容易漂离</text>
    <text x="80" y="314" font-size="14" fill="rgba(255,255,255,0.45)">设计系统与品牌感</text>

    <rect x="430" y="130" width="340" height="260" rx="16" fill="#131318" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="482" cy="190" r="20" fill="rgba(91,159,255,0.14)" stroke="#5B9FFF"/>
    <text x="470" y="195" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#5B9FFF">02</text>
    <text x="462" y="250" font-size="20" font-weight="500" fill="#FFFFFF">进不了业务</text>
    <text x="462" y="286" font-size="14" fill="rgba(255,255,255,0.45)">无法进入真实流程</text>
    <text x="462" y="314" font-size="14" fill="rgba(255,255,255,0.45)">与工程链路脱节</text>

    <rect x="812" y="130" width="340" height="260" rx="16" fill="#131318" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="864" cy="190" r="20" fill="rgba(91,159,255,0.14)" stroke="#5B9FFF"/>
    <text x="852" y="195" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#5B9FFF">03</text>
    <text x="844" y="250" font-size="20" font-weight="500" fill="#FFFFFF">用不起来</text>
    <text x="844" y="286" font-size="14" fill="rgba(255,255,255,0.45)">产品与设计缺少</text>
    <text x="844" y="314" font-size="14" fill="rgba(255,255,255,0.45)">可操作的工作入口</text>
  </g>
</svg>
