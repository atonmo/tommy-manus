<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Demo Flow · Figma → Interactive</title>
    <style>
      :root {
        --bg: #070708;
        --ink: #f2f3f5;
        --ink-2: rgba(255, 255, 255, 0.55);
        --ink-3: rgba(255, 255, 255, 0.28);
        --hair: rgba(255, 255, 255, 0.08);
        --acc: #5b9fff;
        --font: 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      body {
        padding: 4px 0 8px;
      }

      .flow {
        display: grid;
        grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
        gap: 0;
        align-items: stretch;
        width: 100%;
      }

      .card {
        position: relative;
        min-width: 0;
        padding: 20px 18px 18px;
        border-radius: 12px;
        border: 1px solid var(--hair);
        background: rgba(255, 255, 255, 0.03);
      }

      .num {
        position: absolute;
        top: 12px;
        right: 14px;
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
        color: rgba(255, 255, 255, 0.32);
      }

      .title {
        margin: 0 0 10px;
        padding-right: 36px;
        font-size: 15px;
        font-weight: 560;
        line-height: 1.35;
        color: var(--ink);
      }

      .zh {
        font-family: var(--font);
      }

      .sep {
        color: var(--ink-3);
        font-weight: 400;
      }

      .en {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.42);
        vertical-align: 1px;
      }

      .body {
        margin: 0;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink-2);
      }

      .arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        color: rgba(255, 255, 255, 0.28);
        flex-shrink: 0;
      }

      .arrow svg {
        width: 16px;
        height: 16px;
      }

      @media (max-width: 900px) {
        .flow {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        .arrow {
          width: 100%;
          height: 22px;
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="flow">
      <article class="card">
        <span class="num">01</span>
        <h3 class="title">
          <span class="zh">Figma 组件</span><span class="sep"> / </span><span class="en">SOURCE</span>
        </h3>
        <p class="body">既有组件库与设计资产，作为生成起点</p>
      </article>

      <div class="arrow" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M3 8h9M8.5 4.5 12.5 8 8.5 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <article class="card">
        <span class="num">02</span>
        <h3 class="title">
          <span class="zh">关联语义</span><span class="sep"> / </span><span class="en">BIND</span>
        </h3>
        <p class="body">让 AI 读懂组件语义与使用边界</p>
      </article>

      <div class="arrow" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M3 8h9M8.5 4.5 12.5 8 8.5 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <article class="card">
        <span class="num">03</span>
        <h3 class="title">
          <span class="zh">生成页面</span><span class="sep"> / </span><span class="en">GENERATE</span>
        </h3>
        <p class="body">按规范直接产出可交互页面</p>
      </article>

      <div class="arrow" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M3 8h9M8.5 4.5 12.5 8 8.5 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <article class="card">
        <span class="num">04</span>
        <h3 class="title">
          <span class="zh">可交互</span><span class="sep"> / </span><span class="en">DEMO</span>
        </h3>
        <p class="body">跑通「符合规范的生成」路径</p>
      </article>
    </div>

    <script>
      function postHeight() {
        const h = Math.ceil(document.documentElement.scrollHeight)
        parent.postMessage({ type: 'embed-height', height: h }, '*')
      }
      window.addEventListener('load', postHeight)
      new ResizeObserver(postHeight).observe(document.body)
    </script>
  </body>
</html>
