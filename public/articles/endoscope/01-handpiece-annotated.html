<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 2400px;
        height: 1380px;
        overflow: hidden;
        background: #070708;
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'STHeiti', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .board {
        position: relative;
        width: 2400px;
        height: 1380px;
        background:
          radial-gradient(ellipse 52% 42% at 48% 48%, rgba(139, 92, 246, 0.12), transparent 70%),
          #070708;
      }
      .kicker {
        position: absolute;
        left: 64px;
        top: 36px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 15px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #8b5cf6;
      }
      .title {
        position: absolute;
        left: 64px;
        top: 64px;
        font-size: 34px;
        font-weight: 500;
        color: #fff;
        letter-spacing: -0.02em;
      }
      .stage {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 128px;
        bottom: 44px;
        border-radius: 24px;
        background: #fff;
        overflow: hidden;
      }
      .product {
        position: absolute;
        left: -1%;
        right: -1%;
        top: 18%;
        height: 64%;
        object-fit: contain;
        object-position: center;
      }

      .anno {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 5px;
        max-width: 300px;
        z-index: 2;
      }
      .anno .name {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 560;
        color: #111827;
        letter-spacing: -0.01em;
      }
      .anno .name::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #8b5cf6;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
        flex-shrink: 0;
      }
      .anno .txt {
        margin-left: 17px;
        font-size: 13.5px;
        line-height: 1.48;
        color: rgba(17, 24, 39, 0.55);
      }
      .anno.is-right { align-items: flex-end; text-align: right; }
      .anno.is-right .name { flex-direction: row-reverse; }
      .anno.is-right .txt { margin-left: 0; margin-right: 17px; }

      .wires {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      .a-grip  { left: 48px;   top: 36px; }
      .a-ring  { left: 720px;  top: 36px; }
      .a-scope { right: 48px;  top: 36px; }
      .a-mod   { left: 48px;   bottom: 36px; }
      .a-light { left: 820px;  bottom: 36px; }
    </style>
  </head>
  <body>
    <div class="board">
      <p class="kicker">01.A · Handpiece</p>
      <h1 class="title">设计焦点 · 手持端结构拆解</h1>

      <div class="stage">
        <img
          class="product"
          src="file:///Users/tommy/Tommy-manus/public/articles/endoscope/01-handpiece-tight.jpg"
          alt=""
        />

        <!-- Elbow leaders: vertical stub → optional horizontal run → terminal dot -->
        <svg class="wires" viewBox="0 0 2272 1208" preserveAspectRatio="none">
          <defs>
            <marker id="dot" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
              <circle cx="5" cy="5" r="3.4" fill="#8B5CF6" />
              <circle cx="5" cy="5" r="4.8" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.35" />
            </marker>
          </defs>
          <g
            fill="none"
            stroke="#8B5CF6"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.88"
            marker-end="url(#dot)"
          >
            <!-- grip → handle crown -->
            <path d="M200 110 L200 360" />
            <!-- ring → black coupling -->
            <path d="M900 110 L900 390" />
            <!-- scope → mid shaft (elbow) -->
            <path d="M1980 110 L1980 420 L1820 420" />
            <!-- modular → camera/light junction (elbow) -->
            <path d="M170 1085 L170 640 L720 640" />
            <!-- light → hanging module tip -->
            <path d="M1020 1085 L1020 760" />
          </g>
        </svg>

        <div class="anno a-grip">
          <div class="name">握持区</div>
          <p class="txt">浅灰哑光壳体 + 纵向沟槽，手套场景下仍可稳握</p>
        </div>
        <div class="anno a-ring">
          <div class="name">耦合环</div>
          <p class="txt">黑色纹理调节环，兼顾光学对接与快速更换镜体</p>
        </div>
        <div class="anno a-scope is-right">
          <div class="name">镜体延伸</div>
          <p class="txt">医用不锈钢硬镜杆，斜面端头匹配不同术野需求</p>
        </div>
        <div class="anno a-mod">
          <div class="name">模块化</div>
          <p class="txt">摄像主机与光源可拆分组合，服务不同科室复用</p>
        </div>
        <div class="anno a-light">
          <div class="name">微型冷光源模组</div>
          <p class="txt">柱状模组下挂，独立电源键，散热肋片外露</p>
        </div>
      </div>
    </div>
  </body>
</html>
