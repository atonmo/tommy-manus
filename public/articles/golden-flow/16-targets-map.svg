    <text x="1150" y="268" text-anchor="middle" fill="rgba(255,138,31,0.9)" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" letter-spacing="0.12em">设计手段</text>
    <rect x="1080" y="300" width="68" height="36" rx="10" fill="rgba(255,255,255,0.04)"
          stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="1114" y="323" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">数据洞察</text>
    <rect x="1154" y="300" width="68" height="36" rx="10" fill="rgba(255,255,255,0.04)"
          stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="1188" y="323" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">节点归因</text>
    <rect x="1080" y="354" width="68" height="36" rx="10" fill="rgba(255,255,255,0.04)"
          stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="1114" y="377" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">体验干预</text>
    <rect x="1154" y="354" width="68" height="36" rx="10" fill="rgba(255,255,255,0.04)"
          stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="1188" y="377" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">决策现场</text>
    <rect x="1080" y="408" width="68" height="36" rx="10" fill="rgba(255,255,255,0.04)"
          stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="1114" y="431" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">转化回测</text>
    <rect x="1154" y="408" width="68" height="36" rx="10" fill="rgba(255,255,255,0.04)"
          stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="1188" y="431" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">方法沉淀</text>
    <path d="M 1012 390 L 1068 390" stroke="rgba(255,138,31,0.45)" stroke-width="1.5" fill="none"/>
    <polygon points="1072,390 1064,385 1064,395" fill="rgba(255,138,31,0.7)"/>
  </g>

</svg>
