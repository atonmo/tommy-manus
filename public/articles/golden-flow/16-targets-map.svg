    <text x="130" y="398" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">活动投放</text>
    <rect x="70" y="416" width="120" height="34" rx="10" fill="rgba(255,255,255,0.04)"
          stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="130" y="438" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">关键指标</text>
    <rect x="70" y="456" width="120" height="34" rx="10" fill="rgba(255,255,255,0.04)"
          stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="130" y="478" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">交易量增长</text>
    <path d="M 212 390 L 268 390" stroke="rgba(255,138,31,0.45)" stroke-width="1.5" fill="none"/>
    <polygon points="272,390 264,385 264,395" fill="rgba(255,138,31,0.7)"/>
  </g>

