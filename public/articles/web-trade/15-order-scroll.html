<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>下单面板2 · 表单滚动</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
        padding: 2.5% 3.5%;
      }

      /*
        Figma 421:41100「下单面板2」2400×1110
        底图已含遮罩聚光
      */
      .frame {
        position: relative;
        width: min(100%, 1100px, calc((100vh - 32px) * 2400 / 1110));
        aspect-ratio: 2400 / 1110;
        max-height: min(100%, 520px);
        overflow: hidden;
        border-radius: 20px;
        background: #000;
      }

      .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }

      /* 表单背后铺黑 */
      .mask-form {
        position: absolute;
        left: 65.75%; /* 1578/2400 */
        top: 28.288%; /* 314/1110 */
        width: 12.417%; /* 298/2400 */
        height: 33.964%; /* 377/1110 */
        background: #020202;
        z-index: 1;
        pointer-events: none;
      }

      .mask-seam {
        position: absolute;
        left: 65.292%; /* 1567/2400 */
        top: 68.829%; /* 764/1110 */
        width: 13.375%; /* 321/2400 */
        height: 4.324%; /* 48/1110 */
        background: #020202;
        z-index: 3;
        pointer-events: none;
      }

      /*
        滚动视口 — 下单1 1
        1583,303 · 290×503 · 内图 139.17%
      */
      .form-clip {
        position: absolute;
        left: 65.958%; /* 1583/2400 */
        top: 27.297%; /* 303/1110 */
        width: 12.083%; /* 290/2400 */
        height: 45.315%; /* 503/1110 */
        overflow: hidden;
        z-index: 2;
        background: #020202;
      }

      .form-track {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 139.17%;
        will-change: transform;
        transform: translate3d(0, 0, 0);
      }

      .form-track img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        object-position: top center;
        pointer-events: none;
        user-select: none;
      }

      /* 置顶头 1567,164 · 321×134 */
      .sticky-head {
        position: absolute;
        left: 65.292%;
        top: 14.775%;
        width: 13.375%;
        height: 12.072%;
        z-index: 4;
        pointer-events: none;
      }

      .sticky-head img,
      .sticky-foot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        user-select: none;
      }

      /* 置底 1567,669 · 321×130 */
      .sticky-foot {
        position: absolute;
        left: 65.292%;
        top: 60.27%;
        width: 13.375%;
        height: 11.712%;
        z-index: 4;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="frame" data-figma="421:41100" aria-label="下单面板表单上下滚动">
        <img class="bg" src="./15-order-bg.png" width="4096" height="1894" alt="" />

        <div class="mask-form" aria-hidden="true"></div>

        <div class="form-clip" id="viewport">
          <div class="form-track" id="track">
            <img
              id="strip"
              src="./15-order-form-scroll.png"
              width="870"
              height="2100"
              alt="TWAP 下单表单"
            />
          </div>
        </div>

        <div class="mask-seam" aria-hidden="true"></div>

        <div class="sticky-head">
          <img src="./15-order-sticky-head.png" width="966" height="402" alt="" />
        </div>

        <div class="sticky-foot">
          <img src="./15-order-sticky-foot.png" width="966" height="390" alt="" />
        </div>
      </div>
    </div>

    <script>
      ;(function () {
        const viewport = document.getElementById('viewport')
        const track = document.getElementById('track')
        const strip = document.getElementById('strip')
        const foot = document.querySelector('.sticky-foot')
        if (!viewport || !track) return

        // 表单图 2100px：可开多/可开空数值行约在 1468–1493，开多按钮约 1554 起
        // 滚动只滚到「可开多/可开空」露在置底按钮上方为止
        const END_ROW_BOTTOM = 1493 / 2100
        const BTN_TOP = 1554 / 2100

        let travel = 0
        let raf = 0
        const CYCLE = 8200
        const HOLD = 0.14

        function easeInOut(t) {
          return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
        }

        function measure() {
          const trackH = track.offsetHeight
          const clip = viewport.getBoundingClientRect()
          let visibleBottom = viewport.clientHeight
          if (foot) {
            const fr = foot.getBoundingClientRect()
            // 置底按钮盖住视口下沿，可见区止于按钮顶
            visibleBottom = Math.max(0, Math.min(visibleBottom, fr.top - clip.top))
          }
          const endY = trackH * END_ROW_BOTTOM
          const btnY = trackH * BTN_TOP
          // 终点：可开多行底对齐可见区底；且不超过开多按钮顶
          const toEndRow = endY - visibleBottom
          const beforeBtn = btnY - visibleBottom - 4
          travel = Math.max(0, Math.min(toEndRow, beforeBtn))
        }

        function frame(now) {
          if (travel <= 0) {
            track.style.transform = 'translate3d(0,0,0)'
            raf = requestAnimationFrame(frame)
            return
          }
          const t = (now % CYCLE) / CYCLE
          let p
          if (t < HOLD) p = 0
          else if (t < 0.5 - HOLD) p = easeInOut((t - HOLD) / (0.5 - HOLD * 2))
          else if (t < 0.5 + HOLD) p = 1
          else if (t < 1 - HOLD) p = 1 - easeInOut((t - 0.5 - HOLD) / (0.5 - HOLD * 2))
          else p = 0
          track.style.transform = 'translate3d(0,' + -travel * p + 'px,0)'
          raf = requestAnimationFrame(frame)
        }

        function start() {
          measure()
          cancelAnimationFrame(raf)
          raf = requestAnimationFrame(frame)
        }

        if (strip && !strip.complete) strip.addEventListener('load', start)
        document.querySelectorAll('.bg, .sticky-head img, .sticky-foot img').forEach((img) => {
          if (img && !img.complete) img.addEventListener('load', start)
        })

        start()
        window.addEventListener('resize', start)
        setTimeout(start, 80)
        setTimeout(start, 300)
      })()
    </script>
  </body>
</html>
