<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>币种列表切换</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        display: block;
        opacity: 0;
        transition: opacity 0.28s ease;
        pointer-events: none;
        user-select: none;
      }

      .shot.is-on {
        opacity: 1;
      }

      .hotspots {
        position: absolute;
        left: 0.78%;
        top: 20.19%;
        width: 16.02%;
        height: 20.1%;
        z-index: 4;
      }

      .hot {
        position: absolute;
        left: 0;
        width: 100%;
        height: 32.4%;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        border-radius: 8px;
      }

      .hot:nth-child(1) {
        top: 0%;
      }
      .hot:nth-child(2) {
        top: 33.8%;
      }
      .hot:nth-child(3) {
        top: 66.9%;
      }

      .cursor-dot {
        position: absolute;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.92);
        background: rgba(14, 203, 129, 0.28);
        box-shadow: 0 0 0 5px rgba(14, 203, 129, 0.12);
        pointer-events: none;
        z-index: 6;
        opacity: 0;
        transition:
          left 0.55s cubic-bezier(0.22, 1, 0.36, 1),
          top 0.55s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.2s ease,
          transform 0.15s ease;
      }

      .cursor-dot.is-on {
        opacity: 1;
      }

      .cursor-dot.is-click {
        transform: scale(0.78);
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <img
        class="shot is-on"
        data-id="btc"
        src="/articles/web-trade/coin-switch/btc.png?v=5"
        width="4314"
        height="2856"
        alt="BTCUSDT"
        decoding="async"
        fetchpriority="high"
      />
      <img
        class="shot"
        data-id="doge"
        src="/articles/web-trade/coin-switch/doge.png?v=5"
        width="4314"
        height="2856"
        alt="DOGEUSDT"
        decoding="async"
      />
      <img
        class="shot"
        data-id="eth"
        src="/articles/web-trade/coin-switch/eth.png?v=5"
        width="4314"
        height="2856"
        alt="ETHUSDT"
        decoding="async"
      />

      <div class="hotspots" id="hotspots" role="listbox" aria-label="币种列表">
        <button class="hot" type="button" data-id="btc" aria-label="BTCUSDT" aria-selected="true"></button>
        <button class="hot" type="button" data-id="doge" aria-label="DOGEUSDT" aria-selected="false"></button>
        <button class="hot" type="button" data-id="eth" aria-label="ETHUSDT" aria-selected="false"></button>
      </div>
      <div class="cursor-dot" id="cursor" aria-hidden="true"></div>
    </div>

    <script>
      const COINS = ['btc', 'doge', 'eth']
      const stage = document.getElementById('stage')
      const hotspots = document.getElementById('hotspots')
      const cursor = document.getElementById('cursor')
      const shots = [...document.querySelectorAll('.shot')]

      let activeId = 'btc'
      let autoTimer = null
      let resumeTimer = null

      function moveCursorTo(id) {
        const btn = hotspots.querySelector(`[data-id="${id}"]`)
        if (!btn) return
        const stageRect = stage.getBoundingClientRect()
        const btnRect = btn.getBoundingClientRect()
        cursor.style.left = `${btnRect.left - stageRect.left + btnRect.width * 0.7}px`
        cursor.style.top = `${btnRect.top - stageRect.top + btnRect.height * 0.55}px`
        cursor.classList.add('is-on')
      }

      function selectCoin(id, { fromAuto = false } = {}) {
        if (!COINS.includes(id) || (id === activeId && !fromAuto)) return
        activeId = id
        shots.forEach((img) => img.classList.toggle('is-on', img.dataset.id === id))
        hotspots.querySelectorAll('.hot').forEach((btn) => {
          btn.setAttribute('aria-selected', btn.dataset.id === id ? 'true' : 'false')
        })
        moveCursorTo(id)
        if (fromAuto) {
          cursor.classList.add('is-click')
          window.setTimeout(() => cursor.classList.remove('is-click'), 160)
        } else {
          stopAuto()
          resumeTimer = window.setTimeout(startAuto, 7000)
        }
      }

      function startAuto() {
        stopAuto()
        autoTimer = window.setInterval(() => {
          const idx = COINS.indexOf(activeId)
          selectCoin(COINS[(idx + 1) % COINS.length], { fromAuto: true })
        }, 2600)
      }

      function stopAuto() {
        if (autoTimer) window.clearInterval(autoTimer)
        autoTimer = null
        if (resumeTimer) window.clearTimeout(resumeTimer)
        resumeTimer = null
      }

      hotspots.addEventListener('click', (e) => {
        const btn = e.target.closest('.hot')
        if (btn) selectCoin(btn.dataset.id)
      })

      shots.forEach((img) => {
        if (img.dataset.id === activeId) return
        const warm = new Image()
        warm.src = img.src
      })

      window.addEventListener('resize', () => moveCursorTo(activeId))
      window.setTimeout(() => {
        moveCursorTo(activeId)
        startAuto()
      }, 280)
    </script>
  </body>
</html>
