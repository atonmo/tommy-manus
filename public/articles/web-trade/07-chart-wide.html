<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>更宽的屏幕，更丰富的内容 — Dark Editable</title>
    <!--
      模仿 javaon「更宽的屏幕，更丰富的内容」对比滑杆动效

      替换图片（推荐）：
        把 before / after 截图放到同目录 07-chart-wide/ 下，覆盖：
          before.png  → 窄屏 / 改版前
          after.png   → 宽屏 / 改版后
        或改底部 CONFIG.images 路径

      文章嵌入：?embed=1
    -->
    <style>
      :root {
        --bg: #171a21;
        --text: #f2f4f7;
        --muted: #8b919a;
        --chrome: #12151b;
        --chrome-border: rgba(255, 255, 255, 0.08);
        --toolbar: #151922;
        --url-bg: #1e222b;
        --url-text: #c9ced6;
        --content-bg: #0b0d10;
        --handle: rgba(255, 255, 255, 0.92);
        --handle-ring: rgba(11, 13, 16, 0.55);
        --accent: #ff8a1f;
        --dot-red: #ff5f57;
        --dot-yellow: #febc2e;
        --dot-green: #28c840;
        --icon: #9aa1ab;
        --page-max: 1120px;
        --browser-radius: 14px;
        --font:
          "SF Pro Text", "PingFang SC", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        font-family: var(--font);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: var(--page-max);
        margin: 0 auto;
        padding: 28px 20px 36px;
      }

      .stage {
        display: flex;
        justify-content: center;
      }

      .browser {
        width: 100%;
        background: var(--chrome);
        border-radius: var(--browser-radius);
        border: 1px solid var(--chrome-border);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr minmax(160px, 42%) 1fr;
        align-items: center;
        gap: 12px;
        height: 46px;
        padding: 0 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: var(--toolbar);
      }

      .traffic {
        display: flex;
        gap: 7px;
        align-items: center;
      }

      .traffic i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: block;
      }

      .traffic .r {
        background: var(--dot-red);
      }
      .traffic .y {
        background: var(--dot-yellow);
      }
      .traffic .g {
        background: var(--dot-green);
      }

      .nav-left,
      .nav-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .nav-right {
        justify-content: flex-end;
      }

      .icon-btn {
        width: 16px;
        height: 16px;
        color: var(--icon);
        opacity: 0.75;
      }

      .url {
        height: 28px;
        border-radius: 999px;
        background: var(--url-bg);
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--url-text);
        padding: 0 14px;
      }

      .url svg {
        width: 11px;
        height: 11px;
        opacity: 0.65;
      }

      .viewport {
        position: relative;
        width: 100%;
        /* 与 before/after 截图实际比例一致，避免 cover 裁掉边线 */
        aspect-ratio: 2880 / 1906;
        background: var(--content-bg);
        overflow: hidden;
        cursor: ew-resize;
        user-select: none;
        touch-action: none;
      }

      .layer {
        position: absolute;
        inset: 0;
        background: var(--content-bg) center / cover no-repeat;
      }

      .layer-after {
        z-index: 1;
      }

      .layer-before {
        z-index: 2;
        /* 左侧 before，右侧露出 after —— clip 随滑杆移动 */
        clip-path: inset(0 calc(100% - var(--pos, 50%)) 0 0);
      }

      .divider {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--pos, 50%);
        width: 0;
        z-index: 3;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .divider::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.55);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      }

      .handle {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 44px;
        height: 44px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: var(--handle);
        box-shadow:
          0 6px 18px rgba(0, 0, 0, 0.35),
          0 0 0 6px var(--handle-ring);
        display: grid;
        place-items: center;
      }

      .handle svg {
        width: 22px;
        height: 22px;
        color: #222;
      }

      .badge {
        position: absolute;
        top: 14px;
        z-index: 4;
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        letter-spacing: 0.02em;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }

      .badge-before {
        left: 14px;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .badge-after {
        right: 14px;
        color: #0b0d10;
        background: rgba(255, 138, 31, 0.92);
        border: 1px solid rgba(255, 138, 31, 0.4);
      }

      .hud {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }

      .hud-left {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
        color: var(--muted);
      }

      .pill strong {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex: 1;
        min-width: min(420px, 100%);
        justify-content: flex-end;
      }

      button {
        height: 32px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #1e222b;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        color: #0b0d10;
        border-color: var(--accent);
      }

      input[type="range"] {
        flex: 1;
        min-width: 140px;
        accent-color: var(--accent);
      }

      .hint {
        margin: 12px 0 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .hint code {
        font-size: 11px;
        color: #d4d4d8;
      }

      html.embed,
      html.embed body {
        background: transparent;
      }

      html.embed .page {
        max-width: none;
        padding: 0;
      }

      html.embed .hud,
      html.embed .hint {
        display: none;
      }

      @media (max-width: 720px) {
        .toolbar {
          grid-template-columns: auto 1fr auto;
        }
        .badge {
          font-size: 11px;
          height: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="stage">
        <div class="browser">
          <div class="toolbar">
            <div class="nav-left">
              <div class="traffic">
                <i class="r"></i><i class="y"></i><i class="g"></i>
              </div>
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <path
                  d="M9.5 3.5 5 8l4.5 4.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <path
                  d="M6.5 3.5 11 8 6.5 12.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="url">
              <svg viewBox="0 0 16 16" fill="none">
                <circle
                  cx="8"
                  cy="8"
                  r="5.25"
                  stroke="currentColor"
                  stroke-width="1.3"
                />
                <path
                  d="M3 8h10M8 2.75c1.4 1.5 2.1 3.25 2.1 5.25S9.4 11.75 8 13.25M8 2.75C6.6 4.25 5.9 6 5.9 8s.7 3.75 2.1 5.25"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
              </svg>
              <span id="urlText">xxxxx.com</span>
            </div>
            <div class="nav-right">
              <svg class="icon-btn" viewBox="0 0 16 16" fill="none">
                <path
                  d="M8 3.5v9M3.5 8h9"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </div>

          <div class="viewport" id="viewport" style="--pos: 50%">
            <div class="layer layer-after" id="layerAfter"></div>
            <div class="layer layer-before" id="layerBefore"></div>
            <div class="divider" id="divider">
              <div class="handle" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M8 7v10M16 7v10M4.5 12H10M14 12h5.5"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
            </div>
            <span class="badge badge-before" id="badgeBefore">Before</span>
            <span class="badge badge-after" id="badgeAfter">After</span>
          </div>
        </div>
      </div>

      <div class="hud">
        <div class="hud-left">
          <span class="pill">位置 <strong id="posVal">50%</strong></span>
          <span class="pill">Before <strong id="beforeName">—</strong></span>
          <span class="pill">After <strong id="afterName">—</strong></span>
        </div>
        <div class="controls">
          <button type="button" id="playBtn" class="primary">Pause</button>
          <input
            id="posSlider"
            type="range"
            min="2"
            max="98"
            step="0.1"
            value="50"
            aria-label="Compare position"
          />
        </div>
      </div>
      <p class="hint">
        替换图片：覆盖
        <code>07-chart-wide/before.png</code> 与
        <code>07-chart-wide/after.png</code>，或改文件底部
        <code>CONFIG.images</code>。拖动滑杆 / 点画面可手动对比。
      </p>
    </div>

    <script>
      if (new URLSearchParams(location.search).has("embed")) {
        document.documentElement.classList.add("embed");
      }

      /* ========== 在这里改文案 / 图片 / 动效 ========== */
      const CONFIG = {
        url: "xxxxx.com",
        labels: {
          before: "Before",
          after: "After",
        },
        images: {
          /* 相对本 HTML 的路径；替换文件即可，无需改代码 */
          before: "./07-chart-wide/before.png",
          after: "./07-chart-wide/after.png",
        },
        /* 铺满方式：cover | contain */
        fit: "cover",
        /* 一轮往返时长（秒） */
        duration: 5.2,
        autoplay: true,
        /* 滑杆运动区间（%） */
        posMin: 2,
        posMax: 98,
      };

      const viewport = document.getElementById("viewport");
      const layerBefore = document.getElementById("layerBefore");
      const layerAfter = document.getElementById("layerAfter");
      const slider = document.getElementById("posSlider");
      const playBtn = document.getElementById("playBtn");
      const urlText = document.getElementById("urlText");

      urlText.textContent = CONFIG.url;
      document.getElementById("badgeBefore").textContent = CONFIG.labels.before;
      document.getElementById("badgeAfter").textContent = CONFIG.labels.after;
      document.getElementById("beforeName").textContent = fileName(
        CONFIG.images.before
      );
      document.getElementById("afterName").textContent = fileName(
        CONFIG.images.after
      );

      slider.min = String(CONFIG.posMin);
      slider.max = String(CONFIG.posMax);

      const size = CONFIG.fit === "contain" ? "contain" : "cover";
      layerBefore.style.backgroundImage = `url("${CONFIG.images.before}")`;
      layerAfter.style.backgroundImage = `url("${CONFIG.images.after}")`;
      layerBefore.style.backgroundSize = size;
      layerAfter.style.backgroundSize = size;

      function fileName(path) {
        return String(path).split("/").pop() || path;
      }

      function setPos(pct) {
        const p = Math.max(CONFIG.posMin, Math.min(CONFIG.posMax, pct));
        viewport.style.setProperty("--pos", `${p}%`);
        slider.value = String(p);
        document.getElementById("posVal").textContent = `${p.toFixed(0)}%`;
        return p;
      }

      let playing = CONFIG.autoplay;
      let start = performance.now();
      let pos = 50;

      function loop(now) {
        if (playing) {
          const cycle = CONFIG.duration * 1000;
          const t = ((now - start) % cycle) / cycle;
          const tri = t < 0.5 ? t * 2 : (1 - t) * 2;
          const eased =
            tri < 0.5 ? 2 * tri * tri : 1 - Math.pow(-2 * tri + 2, 2) / 2;
          pos =
            CONFIG.posMax - (CONFIG.posMax - CONFIG.posMin) * eased;
          setPos(pos);
        }
        requestAnimationFrame(loop);
      }

      function posFromEvent(e) {
        const rect = viewport.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = ((clientX - rect.left) / rect.width) * 100;
        return setPos(x);
      }

      let dragging = false;

      viewport.addEventListener("pointerdown", (e) => {
        dragging = true;
        playing = false;
        playBtn.textContent = "Play";
        playBtn.classList.remove("primary");
        viewport.setPointerCapture?.(e.pointerId);
        pos = posFromEvent(e);
      });

      viewport.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        pos = posFromEvent(e);
      });

      const endDrag = () => {
        dragging = false;
      };
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);

      slider.addEventListener("input", () => {
        playing = false;
        playBtn.textContent = "Play";
        playBtn.classList.remove("primary");
        pos = setPos(Number(slider.value));
      });

      playBtn.addEventListener("click", () => {
        playing = !playing;
        playBtn.textContent = playing ? "Pause" : "Play";
        playBtn.classList.toggle("primary", playing);
        if (playing) start = performance.now();
      });

      setPos(50);
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
