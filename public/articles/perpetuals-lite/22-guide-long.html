<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>What is Long? · BingX Lite</title>
    <style>
      :root {
        --bg: #020202;
        --fg: #ffffff;
        --fg-3: rgba(255, 255, 255, 0.48);
        --brand: #0f5fff;
        --frame: #737373;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        font-family:
          'SF Pro Text',
          'SF Pro Display',
          Inter,
          PingFang SC,
          system-ui,
          sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }

      .phone-fit {
        position: relative;
        flex-shrink: 0;
        width: 390px;
        height: 844px;
        overflow: hidden;
      }

      /* Figma 436:46048 — 390 × 844 */
      .phone {
        position: absolute;
        left: 0;
        top: 0;
        width: 390px;
        height: 844px;
        background: var(--bg);
        border: 4px solid var(--frame);
        border-radius: 40px;
        box-sizing: border-box;
        overflow: hidden;
        transform-origin: top left;
      }

      .sheet {
        position: absolute;
        left: -4px;
        top: 139px;
        width: 390px;
        height: 701px;
        border-radius: 40px;
        background: var(--bg);
        box-shadow: 0 -20px 40px rgba(255, 255, 255, 0.08);
      }

      .status {
        position: absolute;
        left: -4px;
        top: -4px;
        width: 390px;
        height: 50px;
        padding-top: 21px;
        background: var(--bg);
        z-index: 3;
      }

      .status-row {
        display: flex;
        align-items: center;
        width: 100%;
        height: 22px;
      }

      .status-time,
      .status-levels {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 22px;
      }

      .status-time {
        font-family: 'SF Pro Text', system-ui, sans-serif;
        font-weight: 600;
        font-size: 17px;
        line-height: 22px;
        padding-top: 2px;
      }

      .title {
        position: absolute;
        left: 32px;
        top: 208px;
        width: 326px;
        margin: 0;
        text-align: center;
        font-size: 32px;
        font-weight: 500;
        line-height: 1.2;
        color: #fff;
        z-index: 2;
      }

      /* Gray block 436:46529 — 382 × 365 @ (4, 266) */
      .video-slot {
        position: absolute;
        left: 4px;
        top: 266px;
        width: 382px;
        height: 365px;
        background: #020202;
        overflow: hidden;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .video-slot video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
      }

      .footer {
        position: absolute;
        left: -4px;
        bottom: -4px;
        width: 390px;
        display: flex;
        flex-direction: column;
        z-index: 2;
      }

      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        width: 390px;
        padding: 16px 16px 16px;
      }

      .btn-next {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 24px;
        background: var(--brand);
        color: #fff;
        font-family: 'SF Pro Text', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 510;
        line-height: 16px;
        cursor: pointer;
      }

      .skip {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.28px;
        line-height: 1.2;
        color: var(--fg-3);
        text-align: center;
      }

      .home-indicator {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        width: 390px;
        height: 34px;
        padding: 8px 120px;
      }

      .home-indicator span {
        display: block;
        width: 134px;
        height: 5px;
        border-radius: 80px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="phone-fit" id="phoneFit">
        <div class="phone" id="phone">
          <div class="sheet" aria-hidden="true"></div>

          <div class="status">
            <div class="status-row">
              <div class="status-time">9:41</div>
              <div class="status-levels" aria-hidden="true">
                <svg width="19" height="12" viewBox="0 0 19.2 12.226" fill="none">
                  <rect x="0" y="7.5" width="3" height="4.7" rx="0.6" fill="#fff" />
                  <rect x="4.4" y="5.2" width="3" height="7" rx="0.6" fill="#fff" />
                  <rect x="8.8" y="2.6" width="3" height="9.6" rx="0.6" fill="#fff" />
                  <rect x="13.2" y="0" width="3" height="12.2" rx="0.6" fill="#fff" />
                </svg>
                <svg width="17" height="12" viewBox="0 0 17.142 12.328" fill="none">
                  <path
                    d="M8.57 3.9c2.2 0 4.2.8 5.8 2.2l1.1-1.2A10.2 10.2 0 0 0 8.57 1.7 10.2 10.2 0 0 0 1.67 4.9l1.1 1.2a8.3 8.3 0 0 1 5.8-2.2Z"
                    fill="#fff"
                  />
                  <path
                    d="M8.57 7.3c1.3 0 2.5.5 3.4 1.3l1.1-1.2a6.5 6.5 0 0 0-9 0l1.1 1.2a4.7 4.7 0 0 1 3.4-1.3Z"
                    fill="#fff"
                  />
                  <circle cx="8.57" cy="11.1" r="1.2" fill="#fff" />
                </svg>
                <svg width="27" height="13" viewBox="0 0 27.328 13" fill="none">
                  <rect x="0.5" y="0.5" width="22" height="12" rx="2.5" stroke="#fff" stroke-opacity="0.35" />
                  <rect x="2" y="2" width="18" height="9" rx="1.5" fill="#fff" />
                  <path d="M24 4.5v4a2 2 0 0 0 0-4Z" fill="#fff" fill-opacity="0.4" />
                </svg>
              </div>
            </div>
          </div>

          <h1 class="title">What is Long?</h1>

          <div class="video-slot">
            <video
              src="./guide/Long.mp4"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
            ></video>
          </div>

          <div class="footer">
            <div class="actions">
              <button type="button" class="btn-next">Next</button>
              <p class="skip">Start Trading now</p>
            </div>
            <div class="home-indicator"><span></span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function fitPhone() {
        const stage = document.getElementById('stage')
        const fit = document.getElementById('phoneFit')
        const phone = document.getElementById('phone')
        if (!stage || !fit || !phone) return
        const s = Math.min(stage.clientWidth / 390, stage.clientHeight / 844, 1)
        phone.style.transform = `scale(${s})`
        fit.style.width = `${390 * s}px`
        fit.style.height = `${844 * s}px`
      }

      fitPhone()
      window.addEventListener('resize', fitPhone)
      if (window.ResizeObserver) {
        new ResizeObserver(fitPhone).observe(document.getElementById('stage'))
      }

      const video = document.querySelector('.video-slot video')
      if (video) {
        video.play().catch(() => {})
      }
    </script>
  </body>
</html>
