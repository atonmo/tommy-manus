      <stop offset="0%" stop-color="rgba(184,245,58,0.05)"/>
      <stop offset="100%" stop-color="rgba(184,245,58,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="780" fill="#050507"/>
  <rect width="1200" height="780" fill="url(#glow)"/>

