<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="Inter, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif">
  <defs>
    <radialGradient id="plate" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#080809"/>
    </radialGradient>
  </defs>

  <!-- Plate -->
  <rect width="1280" height="920" fill="url(#plate)"/>

  <!-- Constellation mesh -->
  <g stroke="rgba(255,255,255,0.07)" stroke-width="0.8" fill="none">
    <circle cx="640" cy="470" r="310"/>
    <circle cx="640" cy="470" r="390"/>
    <circle cx="640" cy="470" r="470"/>
    <path d="M180 200 L1100 720 M200 720 L1080 180 M160 470 L1120 470 M640 80 L640 860"/>
    <path d="M280 140 L980 800 M300 800 L960 140"/>
    <path d="M420 100 L860 840 M440 840 L840 100"/>
    <circle cx="320" cy="250" r="2" fill="rgba(184,245,58,0.35)" stroke="none"/>
    <circle cx="980" cy="260" r="2" fill="rgba(184,245,58,0.35)" stroke="none"/>
    <circle cx="240" cy="560" r="1.5" fill="rgba(255,255,255,0.25)" stroke="none"/>
    <circle cx="1040" cy="580" r="1.5" fill="rgba(255,255,255,0.25)" stroke="none"/>
    <circle cx="640" cy="120" r="1.5" fill="rgba(184,245,58,0.4)" stroke="none"/>
    <circle cx="180" cy="780" r="1.5" fill="rgba(255,255,255,0.2)" stroke="none"/>
    <circle cx="1100" cy="800" r="1.5" fill="rgba(255,255,255,0.2)" stroke="none"/>
  </g>

  <!-- Title -->
  <text x="72" y="78" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="0.12em">DESIGN GOALS</text>
  <line x1="72" y1="90" x2="292" y2="90" stroke="#b8f53a" stroke-width="2"/>

  <!-- Triangle connecting satellite centers -->
  <polygon
    points="640,210 320,700 960,700"
    fill="none"
    stroke="rgba(184,245,58,0.45)"
    stroke-width="1.5"
  />

  <!-- Center circle: principles -->
  <g transform="translate(640 470)">
    <circle r="168" fill="#1c1c20" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <circle r="168" fill="rgba(184,245,58,0.03)"/>
    <text text-anchor="middle" y="-58" fill="#b8f53a" font-size="22" font-weight="700" letter-spacing="0.16em" font-style="italic">PRINCIPLES</text>
    <line x1="-62" y1="-42" x2="62" y2="-42" stroke="#b8f53a" stroke-width="1.5"/>
    <g fill="rgba(255,255,255,0.78)" font-size="16" font-style="italic" text-anchor="middle">
      <text y="-8">·· 易用 · User × Design</text>
      <text y="24">·· 高效 · User × Business</text>
      <text y="56">·· 可靠 · Design × Business</text>
    </g>
  </g>

  <!-- Top satellite: 用户 -->
  <g transform="translate(640 210)">
    <circle r="118" fill="#0a0a0c" stroke="rgba(184,245,58,0.35)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-48" fill="#b8f53a" font-size="13" font-weight="600" letter-spacing="0.14em">TARGET 01</text>
    <text text-anchor="middle" y="-22" fill="#ffffff" font-size="24" font-weight="700" font-style="italic" letter-spacing="0.08em">用户</text>
    <line x1="-28" y1="-10" x2="28" y2="-10" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
    <g fill="rgba(255,255,255,0.72)" font-size="13" font-style="italic" text-anchor="middle">
      <text y="16">·· 决策链路短</text>
      <text y="36">·· 术语有解释</text>
      <text y="56">·· 误触成本低</text>
      <text y="76">·· 看得懂的开仓</text>
    </g>
  </g>

  <!-- Bottom-left satellite: 设计 -->
  <g transform="translate(320 700)">
    <circle r="118" fill="#0a0a0c" stroke="rgba(184,245,58,0.35)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-48" fill="#b8f53a" font-size="13" font-weight="600" letter-spacing="0.14em">TARGET 02</text>
    <text text-anchor="middle" y="-22" fill="#ffffff" font-size="24" font-weight="700" font-style="italic" letter-spacing="0.08em">设计</text>
    <line x1="-28" y1="-10" x2="28" y2="-10" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
    <g fill="rgba(255,255,255,0.72)" font-size="13" font-style="italic" text-anchor="middle">
      <text y="16">·· 大触控热区</text>
      <text y="36">·· Long / Short 语义</text>
      <text y="56">·· 本地化节奏</text>
      <text y="76">·· 降低认知负担</text>
    </g>
  </g>

  <!-- Bottom-right satellite: 业务 -->
  <g transform="translate(960 700)">
    <circle r="118" fill="#0a0a0c" stroke="rgba(184,245,58,0.35)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-48" fill="#b8f53a" font-size="13" font-weight="600" letter-spacing="0.14em">TARGET 03</text>
    <text text-anchor="middle" y="-22" fill="#ffffff" font-size="24" font-weight="700" font-style="italic" letter-spacing="0.08em">业务</text>
    <line x1="-28" y1="-10" x2="28" y2="-10" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
    <g fill="rgba(255,255,255,0.72)" font-size="13" font-style="italic" text-anchor="middle">
      <text y="16">·· 看懂 → 敢下</text>
      <text y="36">·· 会管风险</text>
      <text y="56">·· 引进交易池</text>
      <text y="76">·· 自主用户转化</text>
    </g>
  </g>

  <!-- Peripheral context labels -->
  <g fill="rgba(255,255,255,0.42)" font-size="14" letter-spacing="0.02em">
    <!-- near user / top-left -->
    <text x="170" y="280">信息降噪</text>
    <text x="170" y="304">链路缩短</text>
    <text x="170" y="328">术语可读</text>
    <!-- near user / top-right -->
    <text x="980" y="280" text-anchor="start">移动端首交</text>
    <text x="980" y="304" text-anchor="start">大触控</text>
    <text x="980" y="328" text-anchor="start">防误触</text>
    <!-- near design / bottom-left area outside -->
    <text x="88" y="620">拉美小白</text>
    <text x="88" y="644">本地化表达</text>
    <!-- near business / bottom-right -->
    <text x="1120" y="620" text-anchor="end">风险前置</text>
    <text x="1120" y="644" text-anchor="end">仓位可读</text>
    <text x="1120" y="668" text-anchor="end">转化闭环</text>
    <!-- bottom center -->
    <text x="640" y="860" text-anchor="middle" fill="rgba(184,245,58,0.55)" font-size="13" letter-spacing="0.08em">看得懂 → 敢下单 → 会管风险</text>
  </g>

  <!-- Fine connector hints from peripherals toward diagram -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="0.8" fill="none">
    <path d="M250 300 L420 250"/>
    <path d="M1030 300 L860 250"/>
    <path d="M180 630 L250 680"/>
    <path d="M1100 640 L1030 690"/>
  </g>
</svg>
