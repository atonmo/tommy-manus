<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Leverage · BingX Lite</title>
    <style>
      :root {
        --bg: #020202;
        --fg: #ffffff;
        --fg-3: rgba(255, 255, 255, 0.48);
        --fg-muted: rgba(255, 255, 255, 0.48);
        --container-2: rgba(42, 44, 44, 0.56);
        --safe: #27ad75;
        --warn: #f59e0b;
        --danger: #f0616d;
        --brand: #0f5fff;
        --label: rgba(255, 255, 255, 0.48);
        --tick: rgba(255, 255, 255, 0.2);
        --tick-major: rgba(255, 255, 255, 0.4);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        font-family:
          'SF Pro Text',
          'SF Pro Display',
          Inter,
          PingFang SC,
          system-ui,
          sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }

      /* Figma 430:46502 — 390 × 844；由 JS 按容器缩放 */
      .phone-fit {
        position: relative;
        flex-shrink: 0;
        width: 390px;
        height: 844px;
        overflow: hidden;
      }

      .phone {
        position: absolute;
        left: 0;
        top: 0;
        width: 390px;
        height: 844px;
        background: var(--bg);
        border: 4px solid #737373;
        border-radius: 40px;
        box-sizing: border-box;
        overflow: hidden;
        transform-origin: top left;
        user-select: none;
        touch-action: none;
      }

      /* StatusBar y=0 h≈62 */
      .status {
        position: absolute;
        left: 0;
        top: 0;
        width: 390px;
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 154px;
        padding: 21px 24px 19px;
      }

      .status-time {
        flex: 1;
        text-align: center;
        font-family: 'SF Pro Text', system-ui, sans-serif;
        font-weight: 600;
        font-size: 17px;
        line-height: 22px;
        letter-spacing: -0.4px;
      }

      .status-levels {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }

      .status-levels img {
        display: block;
      }

      .status-levels .cell {
        width: 19.2px;
        height: 12.23px;
      }
      .status-levels .wifi {
        width: 17.14px;
        height: 12.33px;
      }
      .status-levels .batt {
        width: 27.33px;
        height: 13px;
      }

      /* Nav y=62 h=56 */
      .nav {
        position: absolute;
        left: 0;
        top: 62px;
        width: 390px;
        height: 56px;
        background: var(--bg);
      }

      .nav-back {
        position: absolute;
        left: 4px;
        top: 4px;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .nav-back img {
        width: 24px;
        height: 24px;
      }

      .nav-title {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        pointer-events: none;
      }

      .btc-icon {
        position: relative;
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
      }

      .btc-icon img {
        position: absolute;
        display: block;
      }

      .btc-icon .bg {
        inset: 0;
        width: 24px;
        height: 24px;
      }

      .btc-icon .mark {
        left: 24.5%;
        top: 16.34%;
        width: 51.08%;
        height: 67.33%;
      }

      .nav-title span {
        font-size: 16px;
        font-weight: 500;
        line-height: 20px;
      }

      /* Last Price y=118 — design body-13 */
      .last {
        position: absolute;
        left: 0;
        top: 118px;
        width: 390px;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        line-height: 16px;
        color: var(--fg-muted);
      }

      /* Warning y=176 — visible when >50 */
      .hint {
        position: absolute;
        left: 0;
        top: 176px;
        width: 390px;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        line-height: 16px;
        color: var(--warn);
        opacity: 0;
        transition:
          opacity 0.2s ease,
          color 0.2s ease;
        pointer-events: none;
      }

      .hint.is-on {
        opacity: 1;
      }

      .hint.is-danger {
        color: var(--danger);
      }

      /* Min / Value / Max y=218 */
      .value-row {
        position: absolute;
        left: 0;
        top: 218px;
        width: 390px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 0 40px;
      }

      .chip {
        width: 48px;
        height: 48px;
        border-radius: 9999px;
        background: var(--container-2);
        border: 0;
        color: #fff;
        font-size: 14px;
        line-height: 18px;
        cursor: pointer;
        flex: 0 0 auto;
      }

      .chip:active {
        filter: brightness(1.15);
      }

      .leverage {
        flex: 1;
        text-align: center;
        font-size: 48px;
        font-weight: 500;
        line-height: 56px;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--safe);
        transition: color 0.18s ease;
      }

      /* Ruler — Figma: track 320×92 @ (35,334); caret 4×92 @ (190,302) */
      .ruler-hit {
        position: absolute;
        left: 0;
        top: 292px;
        width: 390px;
        height: 150px;
        cursor: grab;
        z-index: 2;
      }

      .ruler-hit.is-dragging {
        cursor: grabbing;
      }

      .caret {
        position: absolute;
        left: 190px;
        /* tick bottoms sit at 334+64=398; caret h=92 → top 306 底对齐 */
        top: 306px;
        width: 4px;
        height: 92px;
        border-radius: 99px;
        background: var(--brand);
        z-index: 3;
        pointer-events: none;
      }

      .ruler-area {
        position: absolute;
        left: 35px;
        top: 334px;
        width: 320px;
        height: 92px;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
        mask-image: linear-gradient(
          90deg,
          transparent 0%,
          #000 10%,
          #000 90%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(
          90deg,
          transparent 0%,
          #000 10%,
          #000 90%,
          transparent 100%
        );
      }

      .ruler {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        height: 64px;
      }

      .tick {
        position: absolute;
        bottom: 0;
        width: 1px;
        height: 20px;
        margin-left: -0.5px;
        background: var(--tick);
        transform: translateX(-50%);
      }

      .tick.is-major {
        height: 32px;
        background: var(--tick-major);
      }

      .labels {
        position: absolute;
        left: 0;
        top: 76px;
        width: 320px;
        height: 16px;
      }

      .label {
        position: absolute;
        top: 0;
        width: 40px;
        margin-left: -20px;
        text-align: center;
        font-size: 12px;
        line-height: 16px;
        color: var(--label);
        font-variant-numeric: tabular-nums;
        transform: translateX(0);
      }

      /* Keypad y=476 */
      .keypad {
        position: absolute;
        left: 0;
        top: 476px;
        width: 390px;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .key-row {
        display: flex;
        width: 100%;
      }

      .key {
        flex: 1;
        height: 44px;
        border: 0;
        background: transparent;
        color: #fff;
        font-size: 24px;
        font-weight: 500;
        line-height: 28px;
        cursor: pointer;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        font-family: inherit;
      }

      .key:active {
        background: rgba(255, 255, 255, 0.06);
      }

      .key img {
        width: 24px;
        height: 24px;
        display: block;
      }

      .key .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        display: block;
      }

      /* Footer y=696 */
      .footer {
        position: absolute;
        left: 0;
        top: 696px;
        width: 390px;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        background: #000;
      }

      .confirm {
        width: 350px;
        height: 52px;
        border: 0;
        border-radius: 9999px;
        background: #fff;
        color: #000;
        font-size: 16px;
        font-weight: 500;
        line-height: 20px;
        cursor: pointer;
      }

      .help {
        width: 350px;
        height: 52px;
        display: grid;
        place-items: center;
        color: var(--fg-3);
        font-size: 16px;
        font-weight: 500;
        line-height: 20px;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
        border: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="phone-fit" id="phoneFit">
      <div class="phone" id="phone">
        <div class="status">
          <div class="status-time">9:41</div>
          <div class="status-levels">
            <img class="cell" src="./leverage/cellular.svg" alt="" />
            <img class="wifi" src="./leverage/wifi.svg" alt="" />
            <img class="batt" src="./leverage/battery.svg" alt="" />
          </div>
        </div>

        <div class="nav">
          <button class="nav-back" type="button" aria-label="Back">
            <img src="./leverage/chevron-left.svg" alt="" />
          </button>
          <div class="nav-title">
            <div class="btc-icon">
              <img class="bg" src="./leverage/btc-bg.svg" alt="" />
              <img class="mark" src="./leverage/btc-mark.svg" alt="" />
            </div>
            <span>BTCUSDT · Long</span>
          </div>
        </div>

        <div class="last">Last Price 70,846.2</div>
        <div class="hint" id="hint">Higher leverage increases liquidation risk</div>

        <div class="value-row">
          <button class="chip" id="minBtn" type="button">Min</button>
          <div class="leverage" id="value">10x</div>
          <button class="chip" id="maxBtn" type="button">Max</button>
        </div>

        <div class="caret" aria-hidden="true"></div>
        <div class="ruler-area">
          <div class="ruler" id="ruler"></div>
          <div class="labels" id="labels"></div>
        </div>
        <div class="ruler-hit" id="rulerHit"></div>

        <div class="keypad" id="keypad">
          <div class="key-row">
            <button class="key" data-k="1" type="button">1</button>
            <button class="key" data-k="2" type="button">2</button>
            <button class="key" data-k="3" type="button">3</button>
          </div>
          <div class="key-row">
            <button class="key" data-k="4" type="button">4</button>
            <button class="key" data-k="5" type="button">5</button>
            <button class="key" data-k="6" type="button">6</button>
          </div>
          <div class="key-row">
            <button class="key" data-k="7" type="button">7</button>
            <button class="key" data-k="8" type="button">8</button>
            <button class="key" data-k="9" type="button">9</button>
          </div>
          <div class="key-row">
            <button class="key" data-k="." type="button"><span class="dot"></span></button>
            <button class="key" data-k="0" type="button">0</button>
            <button class="key" data-k="back" type="button">
              <img src="./leverage/backspace.svg?v=4" width="24" height="24" alt="backspace" />
            </button>
          </div>
        </div>

        <div class="footer">
          <button class="confirm" id="confirm" type="button">Set 10x Leverage</button>
          <button class="help" type="button">What is leverage?</button>
        </div>
      </div>
      </div>
    </div>

    <script>
      const MIN = 1
      const MAX = 125
      /* Figma labels every 5x are 70px apart → 14px per 1x */
      const PX = 14
      const HALF = 12
      const CENTER = 160

      const valueEl = document.getElementById('value')
      const hintEl = document.getElementById('hint')
      const confirmEl = document.getElementById('confirm')
      const rulerEl = document.getElementById('ruler')
      const labelsEl = document.getElementById('labels')
      const hitEl = document.getElementById('rulerHit')

      let leverage = 10
      let typing = ''
      let dragging = false
      let dragStartX = 0
      let dragStartLev = 10
      let autoPlaying = true
      let raf = 0
      let startTs = 0
      let lastPainted = null

      function colorFor(x) {
        if (x > 80) return 'var(--danger)'
        if (x > 50) return 'var(--warn)'
        return 'var(--safe)'
      }

      function clamp(n) {
        return Math.max(MIN, Math.min(MAX, n))
      }

      function isMajor(v) {
        return v === 1 || v % 5 === 0
      }

      /** Paint a centered window so every major tick sits under its label. */
      function paintRuler(shown) {
        if (lastPainted === shown) return
        lastPainted = shown
        rulerEl.innerHTML = ''
        labelsEl.innerHTML = ''

        const tickFrag = document.createDocumentFragment()
        const labFrag = document.createDocumentFragment()

        for (let v = shown - HALF; v <= shown + HALF; v++) {
          if (v < MIN || v > MAX) continue
          const x = CENTER + (v - shown) * PX

          const tick = document.createElement('div')
          tick.className = 'tick' + (isMajor(v) ? ' is-major' : '')
          tick.style.left = x + 'px'
          tickFrag.appendChild(tick)

          if (isMajor(v)) {
            const lab = document.createElement('div')
            lab.className = 'label'
            lab.textContent = v + 'x'
            lab.style.left = x + 'px'
            labFrag.appendChild(lab)
          }
        }

        rulerEl.appendChild(tickFrag)
        labelsEl.appendChild(labFrag)
      }

      function setLeverage(n, { snap = true, fromPad = false } = {}) {
        leverage = snap ? Math.round(clamp(n)) : clamp(n)
        const shown = Math.round(leverage)
        if (!fromPad) typing = String(shown)

        valueEl.textContent = shown + 'x'
        valueEl.style.color = colorFor(shown)
        confirmEl.textContent = 'Set ' + shown + 'x Leverage'

        const risky = shown > 50
        hintEl.classList.toggle('is-on', risky)
        hintEl.classList.toggle('is-danger', shown > 80)

        paintRuler(shown)
      }

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
      }

      // 10(绿) → 51(黄) → 81(红) → 120 → 回落
      const demoKeyframes = [
        { t: 0, v: 10 },
        { t: 0.16, v: 50 },
        { t: 0.2, v: 51 },
        { t: 0.36, v: 80 },
        { t: 0.4, v: 81 },
        { t: 0.56, v: 120 },
        { t: 0.66, v: 120 },
        { t: 0.84, v: 40 },
        { t: 1, v: 10 },
      ]
      const CYCLE_MS = 7800

      function demoValueAt(p) {
        for (let i = 0; i < demoKeyframes.length - 1; i++) {
          const a = demoKeyframes[i]
          const b = demoKeyframes[i + 1]
          if (p >= a.t && p <= b.t) {
            const local = (p - a.t) / (b.t - a.t || 1)
            return a.v + (b.v - a.v) * easeInOut(local)
          }
        }
        return 10
      }

      function tick(ts) {
        if (!autoPlaying) return
        if (!startTs) startTs = ts
        const p = ((ts - startTs) % CYCLE_MS) / CYCLE_MS
        setLeverage(demoValueAt(p))
        raf = requestAnimationFrame(tick)
      }

      function startAuto() {
        autoPlaying = true
        startTs = 0
        cancelAnimationFrame(raf)
        raf = requestAnimationFrame(tick)
      }

      function stopAuto() {
        autoPlaying = false
        cancelAnimationFrame(raf)
      }

      function scheduleResume() {
        clearTimeout(scheduleResume._t)
        scheduleResume._t = setTimeout(startAuto, 2400)
      }

      function pointerX(e) {
        return e.touches ? e.touches[0].clientX : e.clientX
      }

      function onDown(e) {
        stopAuto()
        dragging = true
        hitEl.classList.add('is-dragging')
        dragStartX = pointerX(e)
        dragStartLev = leverage
        e.preventDefault()
      }

      function onMove(e) {
        if (!dragging) return
        const scale = phoneScale()
        const dx = (pointerX(e) - dragStartX) / scale
        setLeverage(dragStartLev - dx / PX)
        e.preventDefault()
      }

      function onUp() {
        if (!dragging) return
        dragging = false
        hitEl.classList.remove('is-dragging')
        scheduleResume()
      }

      function phoneScale() {
        return window.__phoneScale || 1
      }

      function fitPhone() {
        const stage = document.getElementById('stage')
        const fit = document.getElementById('phoneFit')
        const phone = document.getElementById('phone')
        if (!stage || !fit || !phone) return
        const s = Math.min(stage.clientWidth / 390, stage.clientHeight / 844, 1)
        window.__phoneScale = s
        phone.style.transform = `scale(${s})`
        fit.style.width = `${390 * s}px`
        fit.style.height = `${844 * s}px`
      }

      fitPhone()
      window.addEventListener('resize', fitPhone)
      if (window.ResizeObserver) {
        new ResizeObserver(fitPhone).observe(document.getElementById('stage'))
      }

      setLeverage(10)
      startAuto()

      hitEl.addEventListener('mousedown', onDown)
      hitEl.addEventListener('touchstart', onDown, { passive: false })
      window.addEventListener('mousemove', onMove, { passive: false })
      window.addEventListener('touchmove', onMove, { passive: false })
      window.addEventListener('mouseup', onUp)
      window.addEventListener('touchend', onUp)

      document.getElementById('minBtn').addEventListener('click', () => {
        stopAuto()
        typing = ''
        setLeverage(MIN)
        scheduleResume()
      })
      document.getElementById('maxBtn').addEventListener('click', () => {
        stopAuto()
        typing = ''
        setLeverage(MAX)
        scheduleResume()
      })

      document.getElementById('keypad').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-k]')
        if (!btn) return
        stopAuto()
        const k = btn.getAttribute('data-k')
        if (k === 'back') {
          typing = typing.slice(0, -1)
        } else if (k === '.') {
          // decimal unused for integer leverage
        } else {
          if (typing.length >= 3) typing = ''
          typing += k
        }
        const n = parseInt(typing || '0', 10)
        setLeverage(n === 0 ? MIN : n, { fromPad: true })
        scheduleResume()
      })
    </script>
  </body>
</html>
