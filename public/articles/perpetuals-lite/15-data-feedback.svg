<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" font-family="Inter, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.045)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.018)"/>
    </linearGradient>
  </defs>

  <!-- Metric 01 -->
  <rect x="0" y="0" width="408" height="320" rx="16" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="204" y="132" text-anchor="middle" fill="#B8F53A" font-size="64" font-weight="600" letter-spacing="-0.04em" font-family="JetBrains Mono, ui-monospace, monospace">78%</text>
  <text x="204" y="178" text-anchor="middle" fill="rgba(255,255,255,0.88)" font-size="16" font-weight="500">首交完成率</text>
  <text x="204" y="208" text-anchor="middle" fill="rgba(255,255,255,0.38)" font-size="13">灰度两周 · 环比提升</text>

  <!-- Metric 02 -->
  <rect x="436" y="0" width="408" height="320" rx="16" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="640" y="132" text-anchor="middle" fill="#B8F53A" font-size="64" font-weight="600" letter-spacing="-0.04em" font-family="JetBrains Mono, ui-monospace, monospace">2.1×</text>
  <text x="640" y="178" text-anchor="middle" fill="rgba(255,255,255,0.88)" font-size="16" font-weight="500">止盈止损设置率</text>
  <text x="640" y="208" text-anchor="middle" fill="rgba(255,255,255,0.38)" font-size="13">风控触达 · 同步抬升</text>

  <!-- Metric 03 -->
  <rect x="872" y="0" width="408" height="320" rx="16" fill="url(#card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1076" y="132" text-anchor="middle" fill="#B8F53A" font-size="64" font-weight="600" letter-spacing="-0.04em" font-family="JetBrains Mono, ui-monospace, monospace">27%</text>
  <text x="1076" y="178" text-anchor="middle" fill="rgba(255,255,255,0.88)" font-size="16" font-weight="500">新手开仓转化提升</text>
  <text x="1076" y="208" text-anchor="middle" fill="rgba(255,255,255,0.38)" font-size="13">从观望到完成首交</text>

  <!-- Footer -->
  <line x1="0" y1="360" x2="1280" y2="360" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="0" y="396" fill="rgba(255,255,255,0.32)" font-size="12">* 取灰度上线两周后数据对比</text>
</svg>
